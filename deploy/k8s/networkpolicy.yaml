---
# NetworkPolicy for redactly-app
# Allows ingress from ingress-nginx AND nginx-gateway (NGF — NGF-Migration);
# egress only to DNS. These are static SPAs — the server process cannot phone home.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redactly-app
  namespace: redactly
  labels:
    app.kubernetes.io/name: redactly-app
    app.kubernetes.io/part-of: redactly
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redactly-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress-nginx (legacy) AND nginx-gateway (NGF) pods.
    # NGF-Cutover: nginx-gateway ersetzt ingress-nginx host-by-host; beide
    # Controller koexistieren parallel bis zur Decommission.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow DNS resolution only (UDP + TCP port 53)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# NetworkPolicy for redactly-landing
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redactly-landing
  namespace: redactly
  labels:
    app.kubernetes.io/name: redactly-landing
    app.kubernetes.io/part-of: redactly
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redactly-landing
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress-nginx (legacy) AND nginx-gateway (NGF) pods.
    # NGF-Cutover: nginx-gateway ersetzt ingress-nginx host-by-host; beide
    # Controller koexistieren parallel bis zur Decommission.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow DNS resolution only (UDP + TCP port 53)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
