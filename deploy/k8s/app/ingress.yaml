apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: de-pii-app
  namespace: de-pii
  labels:
    app.kubernetes.io/name: de-pii-app
    app.kubernetes.io/part-of: de-pii
  annotations:
    # Change this to your cluster's ClusterIssuer name if different.
    # Common values: letsencrypt-prod, letsencrypt-staging
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.redactly.dev
      secretName: de-pii-app-tls
  rules:
    - host: app.redactly.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: de-pii-app
                port:
                  number: 80
