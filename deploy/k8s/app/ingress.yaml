apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redactly-app
  namespace: redactly
  labels:
    app.kubernetes.io/name: redactly-app
    app.kubernetes.io/part-of: redactly
  annotations:
    # Change this to your cluster's ClusterIssuer name if different.
    # Common values: letsencrypt-prod, letsencrypt-staging
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: redactly-app-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redactly-app
                port:
                  number: 80
