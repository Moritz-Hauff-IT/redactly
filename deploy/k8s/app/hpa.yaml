apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redactly-app
  namespace: redactly
  labels:
    app.kubernetes.io/name: redactly-app
    app.kubernetes.io/part-of: redactly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redactly-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
