apiVersion: apps/v1
kind: Deployment
metadata:
  name: de-pii-app
  namespace: de-pii
  labels:
    app.kubernetes.io/name: de-pii-app
    app.kubernetes.io/part-of: de-pii
    app.kubernetes.io/component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: de-pii-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: de-pii-app
        app.kubernetes.io/part-of: de-pii
        app.kubernetes.io/component: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user in nginx:alpine
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/moritz-hauff-it/redactly-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: '10m'
              memory: '32Mi'
            limits:
              cpu: '200m'
              memory: '128Mi'
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: nginx-tmp
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
            - name: nginx-logs
              mountPath: /var/log/nginx
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
        - name: nginx-logs
          emptyDir: {}
