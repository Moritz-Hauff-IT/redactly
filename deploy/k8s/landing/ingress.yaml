apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: de-pii-landing
  namespace: de-pii
  labels:
    app.kubernetes.io/name: de-pii-landing
    app.kubernetes.io/part-of: de-pii
  annotations:
    # Change this to your cluster's ClusterIssuer name if different.
    # Common values: letsencrypt-prod, letsencrypt-staging
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    # Replace de-pii.example.com with your actual apex domain.
    - hosts:
        - de-pii.example.com
      secretName: de-pii-landing-tls
  rules:
    - host: de-pii.example.com  # Replace with your actual apex domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: de-pii-landing
                port:
                  number: 80
