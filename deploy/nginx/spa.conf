server {
  listen 8080;
  server_name _;

  # Browsers refuse to execute ES modules served with the wrong MIME type
  # (strict module-script check). nginx's built-in mime.types maps `.js`
  # to application/javascript but does NOT include `.mjs` or `.wasm`,
  # which breaks SvelteKit's content-hashed module bundles (e.g.
  # /_app/immutable/.../pdf.worker.*.mjs) AND the bundled Tesseract /
  # ONNX runtime WASM assets we self-host.
  #
  # IMPORTANT: include the default mime.types FIRST so html/css/json/etc.
  # keep their correct Content-Type — then EXTEND with the two extra
  # mappings via a separate `types {}` block. A bare `types {}` here
  # would REPLACE the default map entirely and cause everything else
  # (including index.html) to fall through to default_type → browsers
  # would treat the SPA as a binary download.
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
    application/wasm wasm;
  }
  default_type application/octet-stream;

  # Health endpoint — used by Kubernetes probes
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # SvelteKit immutable assets — long-lived cache (content-addressed filenames)
  location /_app/immutable/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # All other requests: serve static files, fall back to SPA index
  root /usr/share/nginx/html;
  index index.html;

  # HTML MUST NOT be cached. index.html references content-hashed chunks
  # under /_app/immutable/ that change on every deploy; if the browser
  # serves a stale HTML (default heuristic cache is ~10min after a fresh
  # response with no Cache-Control), the referenced chunk hashes 404 and
  # the user sees "Failed to fetch dynamically imported module" the moment
  # they touch a lazy-loaded route. no-cache + must-revalidate forces an
  # ETag round-trip on every navigation.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    try_files $uri =404;
  }

  location / {
    # SPA fallback: rewritten requests to /index.html re-match the .html$
    # location above, so Cache-Control is applied consistently for both
    # direct .html hits and SPA-route navigations.
    try_files $uri $uri/ /index.html =404;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # CSP is applied via <meta> in app.html for flexibility;
    # add a restrictive baseline here that the meta tag can relax per-browser rules.
  }

  # Don't expose nginx version in error pages / headers
  server_tokens off;
}
