# Quick-start self-hosting via Docker Compose.
#
# The container listens on localhost only (127.0.0.1:8080). Put a reverse
# proxy in front (Caddy, Traefik, nginx, Cloudflare Tunnel, …) to terminate
# TLS and route your hostname.
#
# Example Caddyfile snippet:
#   app.example.com {
#     reverse_proxy localhost:8080
#   }
#
# Bring up:    docker compose -f deploy/docker-compose.yml up -d
# Tear down:   docker compose -f deploy/docker-compose.yml down

services:
  app:
    image: ghcr.io/moritz-hauff-it/redactly-app:latest
    container_name: redactly-app
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
