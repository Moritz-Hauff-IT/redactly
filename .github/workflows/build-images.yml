name: Build & Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        target: [app, landing]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build timestamp
        id: ts
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.target }}/Dockerfile
          push: true
          # Tags: latest + git SHA + run number for traceability
          tags: |
            ghcr.io/${{ github.repository_owner }}/de-pii-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/de-pii-${{ matrix.target }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/de-pii-${{ matrix.target }}:run-${{ github.run_number }}
          # Cache layers from the registry to speed up rebuilds
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/de-pii-${{ matrix.target }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/de-pii-${{ matrix.target }}:buildcache,mode=max
          # Build-time labels for traceability
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.ts.outputs.created }}

# NOTE: This workflow only builds and pushes images — it does NOT deploy to the cluster.
# Deployment is intentionally manual (or via your CD tool, e.g. Argo CD / Flux).
# See deploy/README.md for instructions.
